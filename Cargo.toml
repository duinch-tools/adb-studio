[package]
name = "adb-studio"
version = "1.0.0"
edition = "2024"
authors = ["Duinch Tools <https://github.com/duinch-tools>"]
license = "MIT"
description = "Fast, cross-platform Android companion studio with Screenshot, Live Preview Recording, and Android Studio-grade Logcat."
readme = "README.md"
repository = "https://github.com/duinch-tools/adb-studio"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arboard = "3.4"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
which = "7"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
